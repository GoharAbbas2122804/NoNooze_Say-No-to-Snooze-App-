apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.nonooze.wakevision'
version = '1.0.0'

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace 'com.nonooze.wakevision'
    compileSdkVersion getExtOrDefault('compileSdkVersion', 37)

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion', 24)
        targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // 2.14.0's transitive tensorflow-lite-api AAR shares namespace
    // org.tensorflow.lite, which AGP 8+/9 rejects at app manifest merge.
    // 2.16.1 gives the -api artifact its own namespace; Interpreter API is unchanged.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'

    // AndroidX & Graphics
    implementation 'androidx.core:core-ktx:1.12.0'
}
