apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.nonooze.wakevision'
version = '1.0.0'

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace 'com.nonooze.wakevision'
    compileSdkVersion getExtOrDefault('compileSdkVersion', 37)

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion', 24)
        targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // TensorFlow Lite Android Runtime (Interpreter)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    // AndroidX & Graphics
    implementation 'androidx.core:core-ktx:1.12.0'
}
